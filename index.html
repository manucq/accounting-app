<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounting Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
}

.header {
    background: #0b3d91;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    text-align: center;
}

.card h3 {
    margin: 0;
    color: #777;
}

.card h1 {
    margin: 10px 0 0 0;
    font-size: 28px;
}

.upload-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

button {
    background: #0b3d91;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #062b63;
}

.charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

canvas {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

@media(max-width: 900px) {
    .charts {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="header">Professional Accounting Dashboard</div>

<div class="container">

<div class="upload-box">
    <input type="file" id="fileInput" accept="image/*,.pdf">
    <button onclick="uploadFile()">Upload Receipt / Invoice</button>
    <button onclick="downloadExcel()">Download Excel</button>
</div>

<div class="cards">
    <div class="card">
        <h3>Total Income</h3>
        <h1 id="income">$0</h1>
    </div>

    <div class="card">
        <h3>Total Expenses</h3>
        <h1 id="expenses">$0</h1>
    </div>

    <div class="card">
        <h3>Profit</h3>
        <h1 id="profit">$0</h1>
    </div>

    <div class="card">
        <h3>Annual Projection</h3>
        <h1 id="annual">$0</h1>
    </div>
</div>

<div class="charts">
    <canvas id="profitChart"></canvas>
    <canvas id="monthlyChart"></canvas>
</div>

</div>

<script>
async function uploadFile() {
    const fileInput = document.getElementById("fileInput");

    if(fileInput.files.length === 0) {
        alert("Selecciona un archivo");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const response = await fetch("/process-file", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        updateCards(data);

        if(data.error){
            alert("ERROR: " + data.error);
            return;
        }

        updateCards(data);

    } catch (err) {
        alert("Error subiendo archivo");
        console.error(err);
    }
}

function updateCards(data) {
    document.getElementById("income").innerText = "$" + data.income.toFixed(2);
    document.getElementById("expenses").innerText = "$" + data.expenses.toFixed(2);
    document.getElementById("profit").innerText = "$" + data.profit.toFixed(2);
    document.getElementById("annual").innerText = "$" + data.annual.toFixed(2);
}
</script>

</body>
</html>

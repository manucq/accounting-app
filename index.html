<!DOCTYPE html>
<html>
<head>
    <title>Accounting App PRO</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f8;
        }

        /* LOGIN SCREEN */

        .login-screen{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2ecc71,#27ae60);
        }

        .login-box{
            background:white;
            padding:30px;
            border-radius:20px;
            width:90%;
            max-width:320px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.15);
            animation:fadeIn 0.6s ease;
        }

        .login-box h2{
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:12px;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:15px;
        }

        button{
            width:100%;
            padding:14px;
            background:#2ecc71;
            border:none;
            color:white;
            font-weight:bold;
            border-radius:12px;
            font-size:16px;
        }

        /* DASHBOARD */

        .app{
            display:none;
            padding:20px;
        }

        .header{
            font-size:24px;
            font-weight:bold;
            margin-bottom:15px;
        }

        .grid{
            display:grid;
            grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
            gap:15px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
            text-align:center;
        }

        .big{
            font-size:26px;
            font-weight:bold;
            margin-top:8px;
        }

        .camera-btn{
            margin-top:20px;
            padding:15px;
            border-radius:15px;
            background:#2ecc71;
            color:white;
            text-align:center;
            font-weight:bold;
        }

        video{
            width:100%;
            border-radius:15px;
            margin-top:15px;
        }

        @keyframes fadeIn{
            from{opacity:0;transform:translateY(20px);}
            to{opacity:1;transform:translateY(0);}
        }

    </style>
</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="login">

    <div class="login-box">
        <h2>Accounting App PRO 💼</h2>

        <input type="text" placeholder="Usuario">
        <input type="password" placeholder="Contraseña">

        <button onclick="login()">Entrar</button>
    </div>

</div>

<!-- APP -->

<div class="app" id="app">

    <div class="header">Dashboard 📊</div>

    <div class="grid">

        <div class="card">
            Income
            <div class="big" id="income">0</div>
        </div>

        <div class="card">
            Expenses
            <div class="big" id="expenses">0</div>
        </div>

        <div class="card">
            Net Profit
            <div class="big" id="profit">0</div>
        </div>

        <div class="card">
            Annual Profit
            <div class="big" id="annual">0</div>
        </div>

    </div>

    <div class="camera-btn" onclick="openCamera()">📸 Scan Receipt / Bank Deposit</div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

</div>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");

function openCamera(){

    navigator.mediaDevices.getUserMedia({
        video:{facingMode:"environment"}
    })
    .then(stream=>{
        video.srcObject = stream;

        // esperar a que el video esté listo
        video.onloadedmetadata = () => {
            startScanning();
        };
    })
    .catch(err=>{
        alert("Camera not allowed");
    });
}

function startScanning(){

    setInterval(()=>{

        if(video.videoWidth === 0) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video,0,0);

        canvas.toBlob(blob=>{

            const formData = new FormData();
            formData.append("file",blob,"scan.jpg");

            fetch("/process-file",{
                method:"POST",
                body:formData
            })
            .then(res=>res.json())
            .then(data=>{

                document.getElementById("income").innerText = data.income;
                document.getElementById("expenses").innerText = data.expenses;
                document.getElementById("profit").innerText = data.profit;
                document.getElementById("annual").innerText = data.annual;

            })
            .catch(err=>{
                console.log("Server not responding");
            });

        });

    },4000);
}

</script>

</body>
</html>

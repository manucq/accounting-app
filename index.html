<!DOCTYPE html>
<html>
<head>
    <title>Accounting Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            font-family: Arial;
            background:#f4f6f8;
            padding:20px;
            margin:0;
        }

        .header{
            background:#2c3e50;
            color:white;
            padding:20px;
            font-size:22px;
            margin-bottom:20px;
        }

        .logout{
            float:right;
            color:white;
            text-decoration:none;
            font-size:14px;
        }

        .title{
            font-size:28px;
            font-weight:bold;
            margin-bottom:20px;
        }

        .grid{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        .green{border-left:6px solid #2ecc71;}
        .red{border-left:6px solid #e74c3c;}
        .blue{border-left:6px solid #3498db;}

        .big{
            font-size:28px;
            font-weight:bold;
            margin-top:10px;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:#2ecc71;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        input{
            padding:10px;
            margin-bottom:10px;
            width:100%;
            max-width:300px;
        }

        .materials-box{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
            margin-top:20px;
        }

    </style>
</head>

<body>

<div class="header">
    💼 Accounting Dashboard
    <a class="logout" href="/logout">Cerrar sesión</a>
</div>

<div class="title">QuickBooks Style Dashboard 📊</div>

<input type="file" id="fileInput" accept=".xlsx,.xls"><br>
<button onclick="uploadFile()">Upload Excel</button>

<br><br>

<div class="grid">

    <div class="card green">
        <div>Total Income</div>
        <div class="big" id="income">0</div>
    </div>

    <div class="card red">
        <div>Total Expenses</div>
        <div class="big" id="expenses">0</div>
    </div>

    <div class="card blue">
        <div>Profit</div>
        <div class="big" id="profit">0</div>
    </div>

    <div class="card">
        <div>Fuel</div>
        <div class="big" id="fuel">0</div>
    </div>

    <div class="card">
        <div>Materials</div>
        <div class="big" id="materials">0</div>
    </div>

    <div class="card">
        <div>Tools</div>
        <div class="big" id="tools">0</div>
    </div>

</div>

<div class="materials-box">
    <h3>Most Used Materials 🔧</h3>
    <ul id="materialsList"></ul>
</div>

<script>

function uploadFile(){

    const file = document.getElementById("fileInput").files[0];

    if(!file){
        alert("Select a file first");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    fetch("/process",{
        method:"POST",
        body:formData
    })
    .then(res=>res.json())
    .then(data=>{

        document.getElementById("income").innerText = data.income;
        document.getElementById("expenses").innerText = data.expenses;
        document.getElementById("profit").innerText = data.income - data.expenses;
        document.getElementById("fuel").innerText = data.fuel;
        document.getElementById("materials").innerText = data.materials;
        document.getElementById("tools").innerText = data.tools;

        const list = document.getElementById("materialsList");
        list.innerHTML = "";

        if(data.top_materials){
            data.top_materials.forEach(mat=>{
                const li = document.createElement("li");
                li.innerText = mat;
                list.appendChild(li);
            });
        }

    });

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Smart Accounting App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            font-family: Arial;
            background:#f4f6f8;
            margin:0;
            padding:0;
        }

        .header{
            background:#2c3e50;
            color:white;
            padding:20px;
            text-align:center;
            font-size:22px;
        }

        .container{
            padding:20px;
        }

        .title{
            font-size:26px;
            font-weight:bold;
            margin-bottom:20px;
        }

        .grid{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap:15px;
            margin-bottom:25px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
            text-align:center;
        }

        .big{
            font-size:28px;
            font-weight:bold;
            margin-top:10px;
        }

        .green{border-left:6px solid #2ecc71;}
        .red{border-left:6px solid #e74c3c;}
        .blue{border-left:6px solid #3498db;}

        button{
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2ecc71;
            color:white;
            font-weight:bold;
            width:100%;
            margin-top:10px;
            font-size:16px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
        }

    </style>
</head>

<body>

<div class="header">
    💼 Smart Accounting App
</div>

<div class="container">

<div class="title">Dashboard 📊</div>

<input type="file" id="fileInput" accept="image/*">
<button onclick="uploadFile()">📸 Upload Receipt / Bank Deposit</button>

<br><br>

<div class="grid">

    <div class="card green">
        <div>Total Income</div>
        <div class="big" id="income">0</div>
    </div>

    <div class="card red">
        <div>Total Expenses</div>
        <div class="big" id="expenses">0</div>
    </div>

    <div class="card blue">
        <div>Profit</div>
        <div class="big" id="profit">0</div>
    </div>

    <div class="card">
        <div>Annual Profit</div>
        <div class="big" id="annual">0</div>
    </div>

</div>

<button onclick="downloadExcel()">📥 Download Excel</button>

</div>

<script>

function uploadFile(){

    const file = document.getElementById("fileInput").files[0];

    if(!file){
        alert("Select a photo first");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    fetch("/process-file", {
        method:"POST",
        body:formData
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("income").innerText = data.income;
        document.getElementById("expenses").innerText = data.expenses;
        document.getElementById("profit").innerText = data.profit;
        document.getElementById("annual").innerText = data.annual;

    });

}

function downloadExcel(){
    window.location.href = "/download";
}

</script>

</body>
</html>
